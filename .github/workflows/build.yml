---
name: Build Packages

on:
  workflow_dispatch:
    inputs:
      foreman_version:
        description: 'Foreman version to build against (e.g. 3.18). Defaults to the latest stable release.'
        required: false
        default: ''

permissions: {}

jobs:
  build:
    name: Build RPM and DEB packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set Foreman version
        if: inputs.foreman_version != ''
        env:
          INPUT_FOREMAN_VERSION: ${{ inputs.foreman_version }}
        run: echo "FOREMAN_VERSION=$INPUT_FOREMAN_VERSION" >> "$GITHUB_ENV"

      - name: Build RPM
        run: bundle exec rake build:rpm

      - name: Build DEB
        run: bundle exec rake build:deb

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foreman_openbolt-packages
          path: |
            pkg/*.rpm
            pkg/*.deb
